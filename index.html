<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Randki w Twojej okolicy | randki.site</title>
  <meta name="description" content="Poznaj kobiety w swojej okolicy. Przeglądaj profile, zobacz kto jest online i umów się na randkę." />
  <script>
    // Powrót z 404.html (GitHub Pages): ?imie=karolina -> ładny adres /karolina
    (function () {
      var p = new URLSearchParams(location.search);
      var n = p.get("imie");
      if (n) {
        p.delete("imie");
        var q = p.toString();
        history.replaceState(null, "", location.pathname.replace(/\/?$/, "/") + encodeURIComponent(n) + (q ? "?" + q : "") + location.hash);
        window.__SLUG__ = n;
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="logo" href="./" data-home>
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M32 49S13 38 13 25c0-6.5 4.8-11 10.7-11 3.8 0 6.8 2 8.3 5 1.5-3 4.5-5 8.3-5C46.2 14 51 18.5 51 25 51 38 32 49 32 49Z" /></svg>
        </span>
        <span>
          <strong class="logo-name" id="logo-name"></strong>
          <small class="logo-sub" id="logo-sub"></small>
        </span>
      </a>
      <nav class="nav">
        <a href="#poznaj" data-section="poznaj">Poznaj osoby</a>
        <a href="#online" data-section="online">Online</a>
        <a href="#okolica" data-section="okolica">W okolicy</a>
        <a href="#nowe" data-section="nowe">Nowe profile</a>
        <button type="button" data-join="Zaloguj się">Zaloguj się</button>
      </nav>
      <button class="btn btn-primary btn-sm" type="button" data-join>Dołącz za darmo</button>
    </div>
  </header>

  <div id="view"></div>

  <div class="mobile-bar">
    <button class="btn btn-primary" type="button" data-join>Poznaj kogoś w swojej okolicy</button>
  </div>

  <div class="modal-root" id="modal" hidden>
    <div class="backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-x" type="button" data-close aria-label="Zamknij">×</button>
      <div class="eyebrow">Szybki start</div>
      <h2 id="modal-title">Poznaj kogoś nowego</h2>
      <p>Wybierz swój przedział wieku, żeby przejść dalej i zobaczyć dopasowane profile.</p>
      <a class="age-btn age-young" id="age-young" href="#">Mam 18–45 lat</a>
      <a class="age-btn age-old" id="age-old" href="#">Mam więcej niż 45 lat</a>
      <p class="modal-note">Serwis wyłącznie dla osób pełnoletnich.</p>
    </div>
  </div>

  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
