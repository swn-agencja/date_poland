<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
  <title>Czat</title>
  <script>
    // Powrót z 404.html (GitHub Pages): ?imie=karolina -> ładny adres /karolina
    (function () {
      var p = new URLSearchParams(location.search);
      var n = p.get("imie");
      if (n) {
        p.delete("imie");
        var q = p.toString();
        history.replaceState(null, "", location.pathname.replace(/\/?$/, "/") + encodeURIComponent(n) + (q ? "?" + q : "") + location.hash);
        window.__CHAT_NAME__ = n;
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <button class="icon-btn back" type="button" aria-label="Wstecz">
        <svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4" /></svg>
      </button>
      <div class="avatar sm online" id="avatar"></div>
      <div class="who">
        <div class="name" id="name"></div>
        <div class="status" id="status">Aktywna teraz</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" type="button" aria-label="Połączenie głosowe">
          <svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.5 4-2 1.4a11 11 0 0 0 6.4 6.4l1.4-2 4 1.5v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z" /></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Połączenie wideo">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3" /><path d="m15.5 10.5 6-3.5v10l-6-3.5z" /></svg>
        </button>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite">
      <section class="intro">
        <div class="avatar xl" id="intro-avatar"></div>
        <h1 id="intro-name"></h1>
        <p class="intro-sub">Macie nowe dopasowanie 💞</p>
        <p class="intro-meta">Profil zweryfikowany · Aktywna teraz</p>
      </section>
      <div class="time-sep" id="time-sep"></div>
    </main>

    <footer class="bottom">
      <form class="composer" id="composer" autocomplete="off">
        <button class="icon-btn accent" type="button" aria-label="Dodaj">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /><path d="M12 8v8M8 12h8" /></svg>
        </button>
        <button class="icon-btn accent" type="button" aria-label="Zdjęcie">
          <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3" /><circle cx="9" cy="10" r="1.8" /><path d="m21 16-5-5-9 8.5" /></svg>
        </button>
        <div class="field">
          <input id="input" type="text" placeholder="Napisz wiadomość..." maxlength="500" enterkeyhint="send" />
          <button class="icon-btn emoji" id="emoji" type="button" aria-label="Emoji">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0" /><circle cx="9" cy="10" r=".6" /><circle cx="15" cy="10" r=".6" /></svg>
          </button>
        </div>
        <button class="send" type="submit" id="send" aria-label="Wyślij wiadomość" disabled>
          <svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6l2.3 7.2L15 12l-9.3 1.2z" /></svg>
        </button>
      </form>

      <div class="cta" id="cta" hidden>
        <p class="cta-info" id="cta-info"></p>
        <a class="cta-btn" id="cta-btn" href="#"></a>
      </div>
    </footer>
  </div>

  <script src="config.js?v=5"></script>
  <script src="age.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
